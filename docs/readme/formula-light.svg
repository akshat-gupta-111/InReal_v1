<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Risk = 0.6 AI reviewer + 0.25 phrase match + 0.15 rules; the AI alone can&#x27;t hide a post</title><style>.s{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.up{animation:up .6s ease-out both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="fr"><rect width="1000" height="300" rx="20"/></clipPath></defs><rect x=".5" y=".5" width="999" height="299" rx="20" fill="#fffbf5" stroke="#ece3d7"/><text class="s" x="40" y="48" font-size="20" font-weight="800" fill="#0f172a">How the final risk is worked out</text><text class="s" x="40" y="72" font-size="14" fill="#5b6474">three scores, weighted and added</text><g class="up" style="animation-delay:0.20s"><rect x="42.0" y="100" width="548.0" height="56" rx="10" fill="#e11d48" fill-opacity=".9"/><text class="s" x="58.0" y="135" font-size="22" font-weight="800" fill="#fff">60%</text><text class="s" x="46.0" y="184" font-size="15" font-weight="700" fill="#0f172a">AI reviewer</text><text class="s" x="46.0" y="204" font-size="12.5" fill="#5b6474">must quote the line it objects to</text></g><g class="up" style="animation-delay:0.45s"><rect x="594.0" y="100" width="226.0" height="56" rx="10" fill="#d97706" fill-opacity=".9"/><text class="s" x="610.0" y="135" font-size="22" font-weight="800" fill="#fff">25%</text><text class="s" x="598.0" y="184" font-size="15" font-weight="700" fill="#0f172a">Phrase match</text><text class="s" x="598.0" y="204" font-size="12.5" fill="#5b6474">close to a known scam line?</text></g><g class="up" style="animation-delay:0.70s"><rect x="824.0" y="100" width="134.0" height="56" rx="10" fill="#f97316" fill-opacity=".9"/><text class="s" x="840.0" y="135" font-size="22" font-weight="800" fill="#fff">15%</text><text class="s" x="828.0" y="184" font-size="15" font-weight="700" fill="#0f172a">Rules</text><text class="s" x="828.0" y="204" font-size="12.5" fill="#5b6474">risky links and contact details</text></g><g class="up" style="animation-delay:1.1s"><line x1="592.0" y1="86" x2="592.0" y2="166" stroke="#0f172a" stroke-width="2" stroke-dasharray="4 4"/><text class="s" x="584.0" y="80" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">the most the AI can add on its own</text></g><rect class="up" style="animation-delay:1.3s" x="40" y="234" width="920" height="44" rx="12" fill="#f6f1ea"/><text class="s up" style="animation-delay:1.3s" x="60" y="262" font-size="14" fill="#0f172a">So the AI by itself can mark a post <tspan font-weight="700" fill="#d97706">Needs a look</tspan>, never <tspan font-weight="700" fill="#e11d48">Hidden</tspan>. If the AI and the phrase match disagree a lot, a person decides.</text></svg>