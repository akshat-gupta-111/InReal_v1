<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" fill="none" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Today: a layout script per portal that breaks on redesigns. With TinyFish: one plain-English goal per portal.</title><style>.s{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.up{animation:up .6s ease-out both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="fr"><rect width="1000" height="270" rx="20"/></clipPath></defs><rect x=".5" y=".5" width="999" height="269" rx="20" fill="#11151d" stroke="#2a3242"/><text class="s" x="40" y="48" font-size="20" font-weight="800" fill="#eef1f6">Why we're moving to TinyFish web agents</text><g class="up" style="animation-delay:0.20s"><rect x="40" y="72" width="450" height="176" rx="16" fill="#171c26" stroke="#2a3242"/><rect x="40" y="72" width="450" height="5" rx="2.5" fill="#fb7185"/><text class="s" x="62" y="108" font-size="17" font-weight="800" fill="#fb7185">Today</text><path d="M64,131 l7,7 m0,-7 l-7,7" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round"/><text class="s" x="84" y="140" font-size="14" fill="#a3adbd">One layout script per portal (CSS selectors)</text><path d="M64,159 l7,7 m0,-7 l-7,7" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round"/><text class="s" x="84" y="168" font-size="14" fill="#a3adbd">Seven portal readers rewritten on 12 Oct</text><path d="M64,187 l7,7 m0,-7 l-7,7" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round"/><text class="s" x="84" y="196" font-size="14" fill="#a3adbd">Naukri hides later pages behind a captcha</text><path d="M64,215 l7,7 m0,-7 l-7,7" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round"/><text class="s" x="84" y="224" font-size="14" fill="#a3adbd">Company career pages: link only, never read</text></g><g class="up" style="animation-delay:0.55s"><rect x="510" y="72" width="450" height="176" rx="16" fill="#171c26" stroke="#2a3242"/><rect x="510" y="72" width="450" height="5" rx="2.5" fill="#34d399"/><text class="s" x="532" y="108" font-size="17" font-weight="800" fill="#34d399">With TinyFish</text><path d="M533,135 l3.5,3.5 7,-8" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text class="s" x="554" y="140" font-size="14" fill="#eef1f6">One plain-English goal per portal</text><path d="M533,163 l3.5,3.5 7,-8" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text class="s" x="554" y="168" font-size="14" fill="#eef1f6">A redesign doesn&#x27;t change the goal</text><path d="M533,191 l3.5,3.5 7,-8" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text class="s" x="554" y="196" font-size="14" fill="#eef1f6">A real browser for pages that need one</text><path d="M533,219 l3.5,3.5 7,-8" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text class="s" x="554" y="224" font-size="14" fill="#eef1f6">Checks the role is on the company&#x27;s own site</text></g></svg>